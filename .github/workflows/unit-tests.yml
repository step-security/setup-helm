name: 'Run unit tests.'
on: # rebuild any PRs and main branch changes
   pull_request:
      branches:
         - main
   push:
      branches:
         - main

jobs:
   build: # make sure build/ci works properly
      strategy:
         matrix:
            os: ${{ github.actor == 'dependabot[bot]' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm" ]') }}
         fail-fast: false
      runs-on: ${{ matrix.os }}
      steps:
         - uses: actions/checkout@v7

         - name: Run L0 tests.
           run: |
              npm install
              npm test
